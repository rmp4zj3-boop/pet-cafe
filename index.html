<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛孩窩 | 寵物友善咖啡廳 | Paws &amp; Mugs</title>
    <meta name="description" content="毛孩窩寵物友善咖啡廳線上點餐系統，提供多種餐點選擇，支援套餐、發票與電子載具。">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <!-- ZXing for barcode/QR scanning -->
    <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
</head>
<body>

    <!-- Welcome Table Entry Modal -->
    <div class="modal-overlay" id="table-entry-modal" style="display:flex; justify-content:center; align-items:center; z-index:9999;">
        <div class="modal-content" style="max-width:400px; text-align:center; padding:2rem; border-radius:16px;">
            <div style="font-size:3rem; margin-bottom:1rem;">🐾</div>
            <h3 style="font-size:1.4rem; margin-bottom:1rem; color:#d84315;">歡迎來到 <span class="shop-name-display">毛孩窩</span></h3>
            <p style="color:var(--text-muted); margin-bottom:1.5rem; font-size:0.95rem;">為了提供更好的點餐服務，請先填寫您的用餐資訊：</p>
            <form id="table-entry-form" style="display:flex; flex-direction:column; gap:1rem; text-align:left;">
                <div>
                    <label style="font-weight:600; display:block; margin-bottom:0.4rem; font-size:0.9rem;">🪑 桌號</label>
                    <input type="text" id="entry-table-number" class="form-control" placeholder="例如：A1" required style="width:100%; box-sizing:border-box; padding:0.6rem; border:1.5px solid #ddd; border-radius:8px;">
                </div>
                <div>
                    <label style="font-weight:600; display:block; margin-bottom:0.4rem; font-size:0.9rem;">👥 用餐人數</label>
                    <input type="number" id="entry-guests" class="form-control" min="1" max="20" value="2" required style="width:100%; box-sizing:border-box; padding:0.6rem; border:1.5px solid #ddd; border-radius:8px;">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; padding:0.75rem; font-size:1rem; font-weight:bold; margin-top:0.5rem; background:#d84315; border-color:#d84315;">
                    開始點餐 🐾
                </button>
            </form>
        </div>
    </div>

    <!-- Header -->
    <header>
        <a href="#" class="logo">🐾 <span class="shop-name-display">毛孩窩</span></a>
        <button class="cart-btn" id="open-cart-btn">
            🛒 購物車 <span id="cart-count">0</span>
        </button>
    </header>

    <!-- Table Number Banner -->
    <div class="table-banner" style="display:flex; justify-content:space-between; align-items:center; width:100%;">
        <div style="display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap;">
            <span>🪑 桌號：<strong id="display-table-number" style="font-size:1.15rem; color:#e65100;">-</strong></span>
            <span>👥 用餐人數：<strong id="display-guests" style="font-size:1.15rem; color:#e65100;">-</strong> 人</span>
        </div>
        <button type="button" class="btn" id="change-table-btn" style="background:#e0e0e0; padding:0.3rem 0.75rem; font-size:0.85rem; border-radius:6px; font-weight:600;">修改資訊</button>
    </div>

    <!-- Main Content -->
    <main>
        <h1 style="font-size:2rem; margin-bottom:1.25rem;">
            <span class="shop-name-display">毛孩窩</span> 點餐菜單
        </h1>

        <!-- Category Tabs -->
        <div class="category-tabs" id="category-tabs">
            <!-- Injected by JS -->
        </div>

        <!-- Menu Grid -->
        <div class="menu-grid" id="menu-container">
            <!-- Menu items injected by JS -->
        </div>
    </main>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>🛒 您的購物車</h3>
            <button class="close-btn" id="close-cart-btn">&times;</button>
        </div>
        <div class="cart-items" id="cart-items-container">
            <!-- Cart items injected here -->
        </div>

        <!-- Invoice Section -->
        <div class="invoice-section">
            <h4>🧾 發票選項</h4>
            <div class="invoice-options">
                <label><input type="radio" name="invoice-type" value="paper" id="inv-paper" checked> 紙本發票</label>
                <label><input type="radio" name="invoice-type" value="carrier" id="inv-carrier"> 電子載具</label>
                <label><input type="radio" name="invoice-type" value="uniform" id="inv-uniform"> 統一編號</label>
            </div>
            <div id="invoice-carrier-row" style="display:none;" class="invoice-input-row">
                <input type="text" id="carrier-number" placeholder="/XXXXXXX（載具條碼）" maxlength="20">
                <button class="scan-btn" id="scan-carrier-btn">📷 掃描</button>
            </div>
            <div id="invoice-uniform-row" style="display:none;" class="invoice-input-row">
                <input type="text" id="uniform-number" placeholder="請輸入統一編號（8碼）" maxlength="8">
            </div>
        </div>

        <div class="cart-footer">
            <div class="total-row">
                <span>總計</span>
                <span id="cart-total">NT$ 0</span>
            </div>
            <button class="checkout-btn" id="checkout-btn">前往結帳</button>
        </div>
    </div>

    <!-- Set Meal Modal -->
    <div class="modal-overlay" id="setmeal-modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h3 id="setmeal-item-name">品項名稱</h3>
                    <p style="color:var(--text-muted); font-size:0.9rem; margin-top:0.25rem;">
                        基本價格：<span id="setmeal-base-price">NT$ 0</span>
                    </p>
                </div>
                <button class="close-btn" id="close-setmeal-btn">&times;</button>
            </div>
            <div class="modal-body">
                <p style="font-weight:600; margin-bottom:0.75rem;" id="sm-title">選擇套餐（選填）</p>
                <div id="setmeal-options-list">
                    <!-- Injected by JS -->
                </div>
                <div id="eco-cup-container" style="display:none; margin-top:1rem; padding-top:1rem; border-top:1px solid #eee;">
                    <label style="display:flex; align-items:center; gap:0.5rem; font-weight:bold; color:#2e7d32; cursor:pointer;">
                        <input type="checkbox" id="eco-cup-checkbox" style="width:20px; height:20px;">
                        🌱 自備環保杯 (折抵 NT$ 5)
                    </label>
                </div>
                <div class="sm-selected-preview" id="sm-selected-preview"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="confirm-setmeal-btn" style="width:100%; padding:0.75rem; font-size:1rem;">
                    加入購物車
                </button>
            </div>
        </div>
    </div>

    <!-- Camera Modal for Carrier Scan -->
    <div class="modal-overlay" id="camera-modal" style="display:none;">
        <div class="modal-content" style="max-width:400px;">
            <div class="modal-header">
                <h3>📷 掃描電子載具條碼</h3>
                <button class="close-btn" id="close-camera-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="camera-video-wrap">
                    <video id="camera-video" autoplay muted playsinline></video>
                </div>
                <p class="camera-hint">請將條碼對準畫面中央</p>
                <p id="camera-result" style="text-align:center; font-weight:700; color:var(--success-color); margin-top:0.5rem;"></p>
            </div>
        </div>
    </div>

    <!-- Checkout Success Modal -->
    <div class="modal-overlay" id="success-modal" style="display:none;">
        <div class="modal-content" style="text-align:center;">
            <div style="font-size:3rem; margin-bottom:1rem;">✅</div>
            <h3 style="font-size:1.4rem; margin-bottom:0.5rem;">訂單已送出！</h3>
            <p id="success-order-id" style="color:var(--text-muted); margin-bottom:0.5rem;"></p>
            <p id="success-table" style="font-size:1.1rem; font-weight:700; margin-bottom:1.5rem;"></p>
            <button class="btn btn-primary" id="close-success-btn" style="padding:0.75rem 2rem; font-size:1rem;">
                繼續點餐
            </button>
        </div>
    </div>

    <script src="js/firebase-sync.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
